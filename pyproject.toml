[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-agentic-platform"
version = "0.1.0"
description = "Reference runtime for governed agentic and automated-action enterprise systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mesbaul Haque Sazu" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["gap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
